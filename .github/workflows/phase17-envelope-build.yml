name: Phase 17.1 Envelope Store Build

on:
  pull_request:
    branches:
      - diagnostic/phase17-envelope-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-and-verify:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/phase17-durable-envelope-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase17-durable-envelope-store
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply asserted Phase 17.1 patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_phase17_envelope_store.py")
          text = path.read_text(encoding="utf-8")
          old = '    "    pub async fn put_artifact(\\n        &self,",\n'
          new = '    "    pub async fn accept_task(&self, task: TaskRecord) -> StoreResult<TaskRecord> {",\n'
          if old not in text:
              raise SystemExit("ambiguous SQLite insertion anchor was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/apply_phase17_envelope_store.py 2>&1 | tee phase17-patch.log
          python scripts/apply_phase17_envelope_fixups.py 2>&1 | tee -a phase17-patch.log

      - name: Upload patch failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-envelope-patch
          path: phase17-patch.log
          if-no-files-found: error

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee phase17-clippy.log

      - name: Upload Clippy failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-envelope-clippy
          path: phase17-clippy.log
          if-no-files-found: error

      - name: Workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee phase17-tests.log

      - name: Upload test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-envelope-tests
          path: phase17-tests.log
          if-no-files-found: ignore

      - name: Commit verified implementation
        run: |
          if git diff --quiet; then
            echo "Phase 17.1 patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/keryx-store/src/lib.rs crates/keryx-daemon/src/lib.rs crates/keryx-store/tests/envelope_store.rs crates/keryx-daemon/tests/envelope_persistence.rs
          git commit -m "feat(store): persist complete task envelopes atomically"
          git push origin HEAD:feat/phase17-durable-envelope-store
