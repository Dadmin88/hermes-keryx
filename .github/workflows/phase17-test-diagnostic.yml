name: Phase 17 Test Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-tests:
    if: github.head_ref == 'feat/phase17-complete-roundtrip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture workspace test output
        shell: bash
        run: |
          set +e
          cargo test --workspace > phase17-tests.log 2>&1
          status=$?
          cat phase17-tests.log
          echo "test_status=$status"
          exit 0
      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase17-test-diagnostic
          path: phase17-tests.log
          if-no-files-found: error
