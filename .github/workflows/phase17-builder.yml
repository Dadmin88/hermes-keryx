name: Phase 17 Branch Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase17-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-phase17:
    if: github.head_ref == 'feat/phase17-complete-roundtrip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protobuf generator
        run: python -m pip install grpcio-tools
      - name: Apply durable store slice once
        run: |
          if [[ ! -f crates/keryx-store/src/results.rs ]]; then
            python scripts/apply_phase17_protocol_store.py
            python scripts/fix_phase17_store_build.py
          fi
      - name: Apply result transport slice once
        run: |
          if ! grep -q 'SubmitRemoteTask' proto/hermes/keryx/v1/daemon.proto; then
            python scripts/apply_phase17_runtime.py
          else
            echo 'Phase 17 result runtime is already committed'
          fi
      - name: Regenerate Python protobuf stubs
        run: |
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=sdk/python/keryx/proto \
            --grpc_python_out=sdk/python/keryx/proto \
            proto/hermes/keryx/v1/*.proto
      - name: Apply durable TaskHandle polling once
        run: |
          if [[ ! -f sdk/python/tests/test_task_handle_remote.py ]]; then
            python scripts/apply_phase17_sdk.py
          else
            echo 'Phase 17 TaskHandle polling is already committed'
          fi
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        id: verify
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            cargo fmt --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            cd sdk/python
            python -m pip install -e '.[dev]'
            python -m pytest tests -q
          } 2>&1 | tee phase17-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-build-log
          path: phase17-build.log
          if-no-files-found: error
      - name: Commit generated implementation
        if: steps.verify.outputs.status == '0'
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proto crates sdk scripts
          git commit -m 'feat(phase17): complete durable remote result observation'
          git push origin HEAD:${{ github.head_ref }}
      - name: Fail unsuccessful verification
        if: steps.verify.outputs.status != '0'
        run: exit 1
