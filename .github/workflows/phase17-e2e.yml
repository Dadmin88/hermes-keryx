name: Phase 17 Two-Node E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "proto/**"
      - "sdk/python/**"
      - "scripts/e2e_two_node.py"
      - "scripts/apply_phase17_e2e_fix.py"
      - "scripts/apply_phase17_relay_auth.py"
      - "scripts/fix_phase17_auth_builder.py"
      - "scripts/fix_phase17_relay_config.py"
      - ".github/workflows/phase17-e2e.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "proto/**"
      - "sdk/python/**"
      - "scripts/e2e_two_node.py"
      - "scripts/apply_phase17_e2e_fix.py"
      - "scripts/apply_phase17_relay_auth.py"
      - "scripts/fix_phase17_auth_builder.py"
      - "scripts/fix_phase17_relay_config.py"
      - ".github/workflows/phase17-e2e.yml"

permissions:
  contents: read

concurrency:
  group: phase17-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-node-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare authenticated topology source
        run: |
          python scripts/apply_phase17_e2e_fix.py
          if ! grep -q 'NODE_TOKEN_METADATA_KEY' crates/keryx-relay/src/health_server.rs; then
            python scripts/fix_phase17_auth_builder.py
            python scripts/apply_phase17_relay_auth.py
          fi
          python scripts/fix_phase17_relay_config.py

      - name: Build runtime binaries
        shell: bash
        run: |
          mkdir -p .tmp/phase17-e2e
          set -o pipefail
          cargo build --workspace --bins 2>&1 | tee .tmp/phase17-e2e/cargo-build.log

      - name: Install Python SDK
        run: python -m pip install -e 'sdk/python[dev]'

      - name: Run authenticated two-node round trip
        run: |
          python scripts/e2e_two_node.py \
            --bin-dir target/debug \
            --work-dir .tmp/phase17-e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-two-node-failure
          path: .tmp/phase17-e2e
          if-no-files-found: warn
