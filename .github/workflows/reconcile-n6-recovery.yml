name: N6 recovery reconciliation

on:
  push:
    branches: [feat/n6-authenticated-challenge]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main with guarded product-doc resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Keryx N6 Reconciliation"
          git config user.email "keryx-n6-reconciliation@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "docs/current-product.md" || {
              echo "Unexpected conflict set:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            }

            git checkout --theirs -- docs/current-product.md
            python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/current-product.md')
          text = path.read_text()
          capability = '- `nodescale_identity_bind_v1` for the typed Nodescale identity-binding control path.\n'
          capability_replacement = capability + '- `nodescale_identity_challenge_v1` for the typed authenticated Nodescale challenge control path.\n'
          if text.count(capability) != 1:
              raise SystemExit('Unexpected protocol capability section')
          text = text.replace(capability, capability_replacement, 1)
          marker = (
              'This control path exists so higher-level identity systems can use Keryx runtime provenance without pretending a generic task body is authenticated identity.\n\n'
              '## Remote result artifacts\n'
          )
          section = (
              'This control path exists so higher-level identity systems can use Keryx runtime provenance without pretending a generic task body is authenticated identity.\n\n'
              '## Authenticated Nodescale identity challenge\n\n'
              'Keryx also exposes the typed non-execution operation `nodescale.identity.challenge.v1`.\n\n'
              'The challenge request carries no authoritative sender, peer, or nonce identity. The relay derives the source from authenticated node credentials, requires the destination to advertise `nodescale_identity_challenge_v1`, and returns a bounded typed result only through the authenticated destination completion path.\n\n'
              'Keryx provides authenticated at-least-once transport for this operation, not durable challenge issuance authority. The installed destination handler is responsible for durable serialization and deduplication of `(authenticated_sender_peer_id, operation_id)` across duplicate, concurrent, and restart retries. Keryx does not persist challenge secrets, route them through generic task/result storage, or expose this control path to Python task handlers.\n\n'
              '## Remote result artifacts\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Unexpected identity-binding section boundary')
          path.write_text(text.replace(marker, section, 1))
          PY
            git add docs/current-product.md
          fi

          test -z "$(git diff --name-only --diff-filter=U)" || {
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }

          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test -p keryx-relay -p keryx-daemon --locked

          git rm .github/workflows/reconcile-n6-recovery.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile authenticated Nodescale challenge with current main"
          git push origin HEAD:feat/n6-authenticated-challenge
