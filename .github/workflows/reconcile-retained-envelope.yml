name: Retained envelope reconciliation probe

on:
  push:
    branches: [codex/fix-memory-and-disk-exhaustion-vulnerability]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe merge with current main
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "Keryx Reconciliation Probe"
          git config user.email "keryx-reconciliation@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo MERGE_PROBE_CLEAN
            git merge --abort || true
            exit 0
          fi
          echo MERGE_PROBE_CONFLICTS
          git diff --name-only --diff-filter=U
          echo '--- combined diff ---'
          git diff --cc
          git merge --abort || true
          exit 1
