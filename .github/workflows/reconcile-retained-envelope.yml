name: Retained envelope reconciliation

on:
  push:
    branches: [codex/fix-memory-and-disk-exhaustion-vulnerability]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main with guarded documentation resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Keryx Reconciliation"
          git config user.email "keryx-reconciliation@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "docs/current-product.md" || {
              echo "Unexpected conflict set:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            }
            git checkout --theirs -- docs/current-product.md
            python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/current-product.md')
          text = path.read_text()
          needle = (
              'The complete protobuf envelope is persisted atomically with task acceptance, which means nested messages, raw bytes, metadata maps, correlation identifiers, and capability hints survive daemon restart. Idempotent retries must agree with the stored task and envelope; conflicting bytes fail closed.\n'
          )
          addition = (
              needle
              + '\nTask admission enforces both a per-envelope encoded-size limit and an aggregate retained-envelope byte limit. The retained-envelope limit defaults to `256 MiB` and can be set to `0` only to opt into unlimited retained-envelope storage.\n'
          )
          if text.count(needle) != 1:
              raise SystemExit('Unexpected current-product storage contract shape')
          path.write_text(text.replace(needle, addition, 1))
          PY
            git add docs/current-product.md
          fi

          test -z "$(git diff --name-only --diff-filter=U)" || {
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/keryx-daemon/tests/backpressure.rs')
          text = path.read_text()
          start = text.index('fn envelope(task_id: &str) -> TaskEnvelope')
          end = text.index('\nasync fn harness_with_limits', start)
          block = text[start:end]
          if 'deadline_ms:' not in block:
              needle = '        status: 0,\n'
              if block.count(needle) != 2:
                  raise SystemExit('Unexpected backpressure TaskEnvelope helper shape')
              block = block.replace(needle, needle + '        deadline_ms: 0,\n')
              text = text[:start] + block + text[end:]
              path.write_text(text)
          PY

          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test -p keryx-core -p keryx-store -p keryx-daemon --locked
          git rm .github/workflows/reconcile-retained-envelope.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile retained-envelope limit with current main"
          git push origin HEAD:codex/fix-memory-and-disk-exhaustion-vulnerability
