name: Phase 17 Merge Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/phase17-complete-roundtrip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Capture merge-ref Rust diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== FORMAT ==='
            cargo fmt --check
            echo "format_status=$?"
            echo '=== CLIPPY ==='
            cargo clippy --workspace --all-targets -- -D warnings
            echo "clippy_status=$?"
            echo '=== TEST ==='
            cargo test --workspace
            echo "test_status=$?"
          } 2>&1 | tee phase17-merge-diagnostic.log
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase17-merge-diagnostic
          path: phase17-merge-diagnostic.log
          if-no-files-found: error
