name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Build release binaries
        run: |
          cargo build --locked --release -p keryx-cli --bin keryx
          cargo build --locked --release -p keryx-daemon --bin keryxd
          cargo build --locked --release -p keryx-relay --bins
      - name: Package exact-version artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          artifact="keryx-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$artifact"
          for binary in keryx keryxd keryx-relay keryx-node
          do
            install -m 0755 "target/release/$binary" "dist/$artifact/$binary"
          done
          tar -C dist -czf "dist/$artifact.tar.gz" "$artifact"
          (cd dist && sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256")
      - name: Publish versioned artifacts and checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
