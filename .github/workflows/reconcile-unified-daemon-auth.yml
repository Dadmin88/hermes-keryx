name: Unified daemon authorization reconciliation

on:
  push:
    branches: [fix/unified-daemon-authorization]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install Python SDK development dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply guarded unified authorization reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_unified_daemon_auth.py
          python scripts/repair_generated_routing_test.py
          python scripts/repair_worker_loop_auth.py
          python scripts/repair_health_probe_auth.py
          python scripts/repair_lease_recovery_auth.py
          python scripts/repair_fail_retry_auth.py
          bash sdk/python/scripts/generate_protos.sh
          cargo fmt --all
          echo '--- source identity guard locations ---'
          grep -R -n -F 'source_node_id metadata does not match authenticated node identity' crates proto sdk tests scripts || true
          grep -R -n -F 'does not match authenticated node identity' crates proto sdk tests scripts || true

      - name: Validate Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Validate Python SDK
        working-directory: sdk/python
        run: python -m pytest tests -q

      - name: Build real Keryx processes
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p keryx-daemon --bin keryxd -p keryx-relay --bin keryx-relay -p keryx-relay --bin keryx-node

      - name: Run authenticated real two-node round trip
        shell: bash
        run: |
          set -euo pipefail
          python scripts/e2e_two_node.py --bin-dir target/debug

      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Keryx Security Reconciliation"
          git config user.email "keryx-security-reconciliation@users.noreply.github.com"
          git rm scripts/reconcile_unified_daemon_auth.py
          git rm scripts/repair_generated_routing_test.py
          git rm scripts/repair_worker_loop_auth.py
          git rm scripts/repair_health_probe_auth.py
          git rm scripts/repair_lease_recovery_auth.py
          git rm scripts/repair_fail_retry_auth.py
          git rm .github/workflows/reconcile-unified-daemon-auth.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: unify Keryx daemon RPC authorization"
          git push origin HEAD:fix/unified-daemon-authorization
