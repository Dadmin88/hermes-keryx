[workspace]
resolver = "2"
members = [
    "crates/keryx-core",
    "crates/keryx-proto",
    "crates/keryx-store",
    "crates/keryx-daemon",
    "crates/keryx-relay",
    "crates/keryx-cli",
    "crates/keryx-policy",
    "crates/keryx-observe",
    "crates/keryx-testkit",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license-file = "LICENSE"
repository = "https://github.com/DeployFaith/hermes-keryx"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
