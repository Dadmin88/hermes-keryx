[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keryx"
version = "0.1.0"
description = "Python SDK for Hermes Keryx agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.82.1",
  "protobuf>=7.35.0",
  "base58>=2.1",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.82.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["keryx*", "hermes*", "agentanycast*"]

[tool.setuptools.package-dir]
hermes = "keryx/proto/hermes"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]