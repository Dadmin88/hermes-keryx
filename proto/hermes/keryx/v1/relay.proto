syntax = "proto3";
package hermes.keryx.v1;

import "hermes/keryx/v1/common.proto";
import "hermes/keryx/v1/task.proto";
import "hermes/keryx/v1/result.proto";
import "hermes/keryx/v1/control.proto";

service KeryxRelay {
  // Receive-only delivery stream. Task/result mutation frames sent by clients are rejected;
  // use the authenticated unary PublishTask and PublishResult RPCs instead.
  rpc ConnectNode(stream NodeFrame) returns (stream RelayFrame);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  // Authenticated unary task publication.
  rpc PublishTask(PublishTaskRequest) returns (PublishTaskResponse);
  // Authenticated unary terminal-result publication. Success is returned only after the
  // authenticated destination persists the result and acknowledges the relay-issued frame.
  rpc PublishResult(PublishResultRequest) returns (PublishResultResponse);
  // Typed non-execution relay-to-edge control. Source identity is metadata-only.
  rpc PublishNodescaleIdentityBind(PublishNodescaleIdentityBindRequest) returns (PublishNodescaleIdentityBindResponse);
  // Destination-only typed completion for a relay-issued control frame.
  rpc CompleteNodescaleIdentityBind(CompleteNodescaleIdentityBindRequest) returns (CompleteNodescaleIdentityBindResponse);
  rpc AckTask(AckTaskRequest) returns (AckTaskResponse);
  // Destination-owned acknowledgement; the authenticated caller must own the relay frame.
  rpc AckFrame(AckFrameRequest) returns (AckFrameResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}
message HealthResponse {
  bool healthy = 1;
  uint64 connected_peers = 2;
  uint64 registry_size = 3;
  uint64 uptime_seconds = 4;
  string transport_status = 5;
  uint64 tasks_routed = 6;
  string local_peer_id = 7;
}

message NodeFrame {
  string frame_id = 1;
  TaskEnvelope task = 2;
  TaskResultEnvelope result = 3;
  string target_node_id = 4;
}
message RelayFrame {
  string frame_id = 1;
  TaskEnvelope task = 2;
  TaskResultEnvelope result = 3;
  string authenticated_source_node_id = 4;
  string destination_node_id = 5;
  NodescaleIdentityBindV1 nodescale_identity_bind_v1 = 6;
}
message RegisterNodeRequest { NodeId node_id = 1; string token = 2; }
message RegisterNodeResponse { bool accepted = 1; }
message PublishTaskRequest {
  TaskEnvelope task = 1;
  string target_node_id = 2;
  string source_node_id = 3;
}
message PublishTaskResponse {
  TaskId task_id = 1;
  string frame_id = 2;
  string authenticated_source_peer_id = 3;
  string accepted_destination_peer_id = 4;
  string accepted_route = 5;
  int64 accepted_at_ms = 6;
}
message PublishResultRequest {
  TaskResultEnvelope result = 1;
  string target_node_id = 2;
  string source_node_id = 3;
  string frame_id = 4;
}
message PublishResultResponse {
  // True only after authenticated destination acknowledgement of frame_id.
  bool accepted = 1;
  string frame_id = 2;
}

message PublishNodescaleIdentityBindRequest {
  NodescaleIdentityBindV1 operation = 1;
  string target_node_id = 2;
}
message PublishNodescaleIdentityBindResponse {
  string frame_id = 1;
  string destination_node_id = 2;
  NodescaleIdentityBindResult result = 3;
}
message CompleteNodescaleIdentityBindRequest {
  string frame_id = 1;
  NodescaleIdentityBindResult result = 2;
}
message CompleteNodescaleIdentityBindResponse { bool accepted = 1; }
message AckTaskRequest { TaskId task_id = 1; }
message AckTaskResponse { bool accepted = 1; }
message AckFrameRequest { string frame_id = 1; }
message AckFrameResponse { bool accepted = 1; }
