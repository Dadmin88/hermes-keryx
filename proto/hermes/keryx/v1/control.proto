syntax = "proto3";
package hermes.keryx.v1;

// Dedicated non-execution direct-control request. The relay derives source
// identity exclusively from authenticated transport metadata; this message
// intentionally has no peer, source, or sender identity field.
message NodescaleIdentityBindV1 {
  string operation_id = 1;
  string network_id = 2;
  string device_id = 3;
  string join_session_id = 4;
  string binding_nonce = 5;
  uint64 binding_generation = 6;
  string agent_version = 7;
}

enum NodescaleIdentityBindDisposition {
  NODESCALE_IDENTITY_BIND_DISPOSITION_UNSPECIFIED = 0;
  NODESCALE_IDENTITY_BIND_DISPOSITION_ACTIVE = 1;
  NODESCALE_IDENTITY_BIND_DISPOSITION_ALREADY_CONFIRMED = 2;
  NODESCALE_IDENTITY_BIND_DISPOSITION_REJECTED = 3;
}

// Handler-owned semantic result returned to the authenticated publisher.
// reason and code are bounded non-secret operator-safe strings.
message NodescaleIdentityBindResult {
  NodescaleIdentityBindDisposition disposition = 1;
  bool accepted = 2;
  string binding_id = 3;
  uint64 generation = 4;
  uint64 revision = 5;
  string reason = 6;
  string code = 7;
}
