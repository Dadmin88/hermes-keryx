syntax = "proto3";
package hermes.keryx.v1;

// Dedicated non-execution direct-control request. The relay derives source
// identity exclusively from authenticated transport metadata; this message
// intentionally has no peer, source, or sender identity field.
message NodescaleIdentityBindV1 {
  string operation_id = 1;
  string network_id = 2;
  string device_id = 3;
  string join_session_id = 4;
  string binding_nonce = 5;
  uint64 binding_generation = 6;
  string agent_version = 7;
}

// Additive typed-provenance bind. Field 4 is deliberately a provider binding
// identifier and MUST NOT be populated from a V1 join-session value.
message NodescaleIdentityBindV2 {
  string operation_id = 1;
  string network_id = 2;
  string device_id = 3;
  string provider_binding_id = 4;
  string binding_nonce = 5;
  uint64 binding_generation = 6;
  string agent_version = 7;
}

enum NodescaleIdentityBindDisposition {
  NODESCALE_IDENTITY_BIND_DISPOSITION_UNSPECIFIED = 0;
  NODESCALE_IDENTITY_BIND_DISPOSITION_ACTIVE = 1;
  NODESCALE_IDENTITY_BIND_DISPOSITION_ALREADY_CONFIRMED = 2;
  NODESCALE_IDENTITY_BIND_DISPOSITION_REJECTED = 3;
}

// Handler-owned semantic result returned to the authenticated publisher.
// reason and code are bounded non-secret operator-safe strings.
message NodescaleIdentityBindResult {
  NodescaleIdentityBindDisposition disposition = 1;
  bool accepted = 2;
  string binding_id = 3;
  uint64 generation = 4;
  uint64 revision = 5;
  string reason = 6;
  string code = 7;
}

// Dedicated at-least-once challenge issuance request. The relay derives source
// identity exclusively from authenticated transport metadata; the installed
// Nodescale handler must durably deduplicate by (authenticated source, operation_id).
// This message intentionally contains no peer, source, sender, nonce, or task fields.
message NodescaleIdentityChallengeV1 {
  string operation_id = 1;
  string network_id = 2;
  string device_id = 3;
  string join_session_id = 4;
  string agent_version = 5;
}

// Additive typed-provenance challenge. Field 4 is deliberately a provider
// binding identifier and MUST NOT be populated from a V1 join-session value.
message NodescaleIdentityChallengeV2 {
  string operation_id = 1;
  string network_id = 2;
  string device_id = 3;
  string provider_binding_id = 4;
  string agent_version = 5;
}

enum NodescaleIdentityChallengeDisposition {
  NODESCALE_IDENTITY_CHALLENGE_DISPOSITION_UNSPECIFIED = 0;
  NODESCALE_IDENTITY_CHALLENGE_DISPOSITION_ISSUED = 1;
  NODESCALE_IDENTITY_CHALLENGE_DISPOSITION_REJECTED = 2;
}

// The plaintext challenge_secret is delivery-only, returned only over the
// authenticated completion response. It must never enter persistence, logs,
// task envelopes, generic ACKs, callbacks, or dead letters.
message NodescaleIdentityChallengeResult {
  NodescaleIdentityChallengeDisposition disposition = 1;
  bool accepted = 2;
  string challenge_id = 3;
  string challenge_secret = 4;
  uint64 binding_generation = 5;
  uint64 expires_at_unix_ms = 6;
  string reason = 7;
  string code = 8;
}
