syntax = "proto3";
package hermes.keryx.v1;

import "hermes/keryx/v1/common.proto";

message SkillInfo {
  string skill_id = 1;
  string description = 2;
  repeated string tags = 3;
}

message Registration {
  string peer_id = 1;
  repeated SkillInfo skills = 2;
  string name = 3;
  string description = 4;
  Timestamp expires_at = 5;
  // Additive transport features supported by this peer (for example,
  // "absolute_deadlines_v1" or "result_artifact_bytes_v1").
  repeated string protocol_features = 6;
}

message RegisterSkillsRequest {
  string peer_id = 1;
  repeated SkillInfo skills = 2;
  string name = 3;
  string description = 4;
  uint64 ttl_seconds = 5;
  repeated string protocol_features = 6;
}

message RegisterSkillsResponse {
  bool accepted = 1;
}

message UnregisterSkillsRequest {
  string peer_id = 1;
  repeated string skill_ids = 2;
}

message UnregisterSkillsResponse {
  bool accepted = 1;
}

message DiscoverBySkillRequest {
  string skill_id = 1;
  repeated string tags = 2;
  uint32 limit = 3;
}

message DiscoverBySkillResponse {
  repeated Registration registrations = 1;
}

service RegistryService {
  // The registration owner is authenticated metadata; request peer_id must match it.
  rpc RegisterSkills(RegisterSkillsRequest) returns (RegisterSkillsResponse);
  // The deregistration owner is authenticated metadata; request peer_id must match it.
  rpc UnregisterSkills(UnregisterSkillsRequest) returns (UnregisterSkillsResponse);
  // Read-only discovery; it does not mutate registration ownership.
  rpc DiscoverBySkill(DiscoverBySkillRequest) returns (DiscoverBySkillResponse);
}