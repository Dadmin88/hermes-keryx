syntax = "proto3";
package hermes.keryx.v1;

import "hermes/keryx/v1/common.proto";

message AgentManifest { AgentId agent_id = 1; NodeId node_id = 2; string name = 3; string display_name = 4; string description = 5; string version = 6; string runtime = 7; repeated CapabilityId capabilities = 8; map<string, string> labels = 9; map<string, string> metadata = 10; }
